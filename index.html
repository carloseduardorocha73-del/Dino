  <script id="gift-data" type="application/json">{"config":{"name":"Júlia","signature":"De quem te vive. E te escolhe, todos os dias.","since":"","story":"Desde o dia em que te conheci, tudo ficou diferente. Você entrou na minha vida e trouxe alegria, carinho e um amor que eu nunca tinha sentido antes. E assim, você me transformou em uma nova pessoa… eu te vivo.","letter":"Feliz aniversário, minha princesinha.\n\nEu te vivo muito e te amo de uma forma que nem sei explicar. Eu só quero te ver feliz, sempre, e que você viva muitos anos ao meu lado. Porque eu quero realizar tudo com você, inclusive o nosso sonho de casar.\n\nVocê é a melhor coisa que já aconteceu na minha vida, minha fofa. Meu lugar favorito é onde você está, e até os dias mais comuns ficam especiais quando são com você.\n\nQue a vida te devolva todo o carinho que você espalha. Que não faltem motivos para sorrir, sonhos para realizar e o meu abraço quando você precisar.\n\nFeliz aniversário, meu amor. Que este seja só mais um de muitos que vamos comemorar juntos. Eu te amo. Hoje, amanhã e em tudo o que ainda vamos viver.","questions":[{"question":"Qual é o meu lugar favorito no mundo?","options":["Uma praia bem longe","Qualquer lugar com você","A minha cama"],"correct":1,"reply":"Com você, qualquer lugar vira o meu lugar favorito. Até uma fila de supermercado."},{"question":"Qual sonho eu quero realizar com você?","options":["Ganhar na loteria","Ficar famoso","Construir nossa vida e casar"],"correct":2,"reply":"Quero os grandes sonhos e as pequenas rotinas. Uma vida inteira do seu lado."},{"question":"Qual presente seu eu escolheria todos os dias?","options":["Seu abraço","Um relógio","Uma viagem"],"correct":0,"reply":"O seu abraço. Daqueles demorados, em que o mundo parece ficar em silêncio."},{"question":"O que deixa um dia comum mais bonito?","options":["Não ter despertador","Uma mensagem sua","Acertar a previsão do tempo"],"correct":1,"reply":"Uma mensagem, uma risada, um carinho seu. Você tem esse jeito de mudar o meu dia."},{"question":"E se eu pudesse escolher tudo de novo?","options":["Pensaria mais um pouco","Jogaria uma moeda","Escolheria você, outra vez"],"correct":2,"reply":"Em todas as versões da minha vida, eu ia querer encontrar você. Sempre você."}]},"photos":[],"rose":"data:image/webp;base64,UklGRuSTAgBXRUJQVlA4INiTAgCwOgmdASoABgAEPjEYikQiIaEko1TpmJAGCWVukp0KOvcZQM4asXZp3Vg74dUTZoNqOidHFIDeZbnMOSphGLW5/yP+5/q/Su5H7tPlX4P/Qf97/IfL5/O/9/+28jPdP+b+2Pp8+q/0P/m/zv5ZfMD/of/H/df7n4if0H/Y//D/Zfv//zPsO/XL/yf5f/M/t79Lv/R+4nv7/eT1Rf2n/gftn/x/iT/9P7r+9z/B/9f9zP+R8hX9U/0//u/2P7//Hr///de/en/5e43+4H/w9o7/0/up/3flc/uH/S/cv/n/Iz/Uf9P/+P9R/w/gA//vtf/wD/7eoB6U/ervW/4f/J/LX0D/OPtv93/jf9H/0v8d8v/8D/0eY73f/S/9/+89Sf55+av43+R/0f/l/N/7nf6H/u/2HlT9AP+D/S+wX+Wf0z/Y/4D91f8z8qP637f/47y0rk//D/h+wv7zffv+p/mf9V/6v898ZX5nnl+6/77/0+4H/Rv7f/2P8x++n+j+Zf/V4iH5b/p/ur8Af9l/z3/u/0n5sfL9/4/7b/dfuj7qv2X/a/+z/Xf7z5Cv53/cv+j/j/9J+2H/////34//b3ifvH/9Pd3/cL//f7kX0fL0nA8e2peY3QLbLUMeduXMb4TLXBmPP7HQLbLodlRL7kjXh4LodlQvep+Ez7P0rvW0QoRe6RePsX4q+FPPkX7xL+y+3bkM+IVBBufmpdzIzKoA7DuFWP/m3i/sDbIE81WspQav+BxrwgSHF8FPj1j3eCZpLP+lkCTLSWqGvnOA7r/sf9YkNz0mKUqrUzPNmpM/QqAaBKTCKGJskqpJ2l8bRYbE8y8FVlKRXu4WuyW42yp3pJjyyR1lDcuY3x/uehJ9b94ffKFvdQmXP4kN5nnuXDDguoEQm12z4xX8wtVC1iddCsZg0Z6KZhv+pa5/qVNogjIEnk2oHZT4AohPwlF3Aqe9SjPWyUOj//T4B1VskWOWYyyjyV2KtiC7CkLSgaUmqkSw9csVmTa2sN1z9nH86UQ0XitlwPtQ0UbjHogB80Im8qE0bx3B/LeCgo4m8qy5oyHoVuTxZUhy7R+xRznPaeVwK15UcnfG1aUv8jFHIch6fz5XtwJ6Ea/YEXRPTGJ7opjnXjj2TtdsuoUYkX1Wa4kMleddIFWbO2pShlakFz+WPxC03i3Vhdxj6Z3taWEiL1+PmSAmbLgA28XvcXyOLvaWoiq8p4jSd1UCPJlN1B30KQ9ELHYlOfxOfaFPQOStjqTpvw+Mr+bNykpz/TJ/DKt6ypCXCoLusVPAgFyuyfmNkxYu8SUcF0wHa0blcQBva9WpE8gPgOfET/ptRlDxh6vGejpIJjE7cT8t6i56iIC59F2y9JXzq/tUMYrXdUQwo0tSgHyvnAP+yaYx20sj95r24s7iTnCPnrbfepse63cs4dG2oAfu2VJeQblMIXor96Mh/qJCYpY32Ws5eNq2gIQzh0Ot4DYvqXLFu/lYZerovbjQv/yrB/KvaLqPbF96KdVE0n8K2HS+0nn8kCOfzXUodZrc/RXI851HPyxeYGuwBjGBcbTD4eJoapWL4SN5pmYMEwsz3pCGOELptIN8cG4DoXuE0tP3qBrXSrfjp9Hd3Qzw5sL6deJbqw/bJBrnNmb1PHl/VsP8cqNzqbk
